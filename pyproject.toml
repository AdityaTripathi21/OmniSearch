[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mme"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
mme = "mme.cli:main"
mme-mcp = "mme.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
